# .goreleaser.yaml
project_name: dbdiff

before:
  hooks:
    - go mod download

builds:
  - id: dbdiff
    main: .
    binary: dbdiff
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: tarball
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: Meru143
    name: dbdiff
  draft: false
  prerelease: auto

brews:
  - repository:
      owner: Meru143
      name: homebrew-dbdiff
      branch: main
    folder: Formula
    name: dbdiff
    commit_author:
      name: github-actions
    commit_message: |
      {{ .ProjectName }} {{ .Tag }}
      
      Download: {{ .AssetURL }}
