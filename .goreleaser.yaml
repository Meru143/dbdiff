# .goreleaser.yaml
project_name: dbdiff

before:
  hooks:
    - go mod download

builds:
  - id: dbdiff
    main: .
    binary: dbdiff
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

changelog:
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^fix:'

release:
  github:
    owner: Meru143
    name: dbdiff
  draft: false
  prerelease: false
