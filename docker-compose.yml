version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dbdiff-test
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Source database for migration tests
  source-db:
    image: postgres:16-alpine
    container_name: dbdiff-source
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: sourcedb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d sourcedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Target database for migration tests
  target-db:
    image: postgres:16-alpine
    container_name: dbdiff-target
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: targetdb
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d targetdb"]
      interval: 5s
      timeout: 5s
      retries: 5
